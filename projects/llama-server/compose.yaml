services:
  llama-server-rocm:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b10731
    restart: unless-stopped
    ports:
      - "9931:9931"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0 
      - HIP_VISIBLE_DEVICES="0,1"
    devices:
      # Critical for AMD ROCm compute capability
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - keep-groups
    volumes:
      # Map your local models folder to the container's /models folder
      - /home/paul/llama-server/models:/models
      - /home/paul/llama-server/secrets:/secrets:ro
    command: >
      --model /models/hf/unsloth/Qwen3.8-27B-UD-Q8_K_XL.gguf
      --alias qwen3.8-27b
      --ctx-size 262144
      --flash-attn on
      --n-gpu-layers 99
      --split-mode layer
      --ubatch-size 384
      --batch-size 4096
      --no-mmap
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --api-key-file /secrets/llama.key
      --cache-type-k q8_0
      --cache-type-v q8_0
      --metrics
      --port 9931
      --host 0.0.0.0
  llama-server-cuda:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b10731
    restart: unless-stopped
    ports:
      - "9932:9932"
    environment:
      - GGML_CUDA_FORCE_MMQ=1
    devices:
      - "nvidia.com/gpu=0"
    group_add:
      - keep-groups
    volumes:
      # Map your local models folder to the container's /models folder
      - /home/paul/llama-server/models:/models
      - /home/paul/llama-server/secrets:/secrets:ro
    command: >
      --models-preset /models/models-preset.ini
      --models-max 1
      --api-key-file /secrets/llama.key
      --metrics
      --port 9932
      --host 0.0.0.0
